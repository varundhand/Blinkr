<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Break Reminder</title>
    <style>
      /* ====== GENERAL BODY STYLES ====== */
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: transparent;
        font-family: "Poppins", sans-serif;
        overflow: hidden;
        cursor: none;
      }

      /* ====== BACKGROUND DIM ====== */
      .overlay-dim {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(10, 10, 10, 0);
        animation: dimFadeIn 2s forwards ease-in-out;
        z-index: 1;
      }

      @keyframes dimFadeIn {
        from {
          background: rgba(10, 10, 10, 0);
        }
        to {
          background: rgba(10, 10, 10, 0.75);
        }
      }

      /* ====== BREAK CONTENT BOX ====== */
      .break-box {
        position: relative;
        z-index: 10;
        background: rgba(20, 20, 30, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6),
          inset 0 0 40px rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(25px);
        border-radius: 30px;
        text-align: center;
        padding: 80px 100px;
        opacity: 0;
        transform: scale(0.9);
        animation: popIn 0.8s ease-out 1.5s forwards;
        min-width: 500px;
      }

      @keyframes popIn {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* ====== TITLE + TIME ====== */
      .current-time {
        font-size: 1.2rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
        margin-bottom: 20px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }

      .title {
        font-size: 3rem;
        background: linear-gradient(135deg, #ff6b6b 0%, #4ecdc4 50%, #45b7d1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 4px 20px rgba(255, 107, 107, 0.3);
        margin: 20px 0;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .subtitle {
        background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-size: 1.3rem;
        margin-bottom: 30px;
        font-weight: 400;
        letter-spacing: 0.3px;
      }

      /* ====== GIF & TIMER ====== */
      .break-gif {
        width: 280px;
        /* border-radius: 25px; */
        animation: floaty 4s ease-in-out infinite;
        /* box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); */
      }

      @keyframes floaty {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-15px);
        }
      }

      .timer {
        font-size: 2.5rem;
        background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-top: 25px;
        font-weight: 800;
        letter-spacing: 3px;
        text-shadow: 0 0 30px rgba(255, 154, 158, 0.5);
      }

      /* ====== BUTTON ====== */
      .skip-btn {
        margin-top: 40px;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.1) 100%);
        border: 2px solid rgba(255, 255, 255, 0.3);
        padding: 16px 32px;
        border-radius: 50px;
        color: #fff;
        font-size: 1.2rem;
        font-weight: 600;
        backdrop-filter: blur(20px);
        transition: all 0.3s ease;
        cursor: none;
        letter-spacing: 0.5px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      }

      .skip-btn:hover {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0.2) 100%);
        transform: scale(1.08);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
      }

      /* ====== CUSTOM CURSORS ====== */
      .custom-cursor {
        position: fixed;
        top: 0;
        left: 0;
        width: 80px;
        height: 80px;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>

  <body>
    <div class="overlay-dim"></div>

    <div class="break-box">
      <div class="current-time" id="currentTime"></div>
      <h2 class="title">Brief Intermission</h2>
      <p class="subtitle">Focus on a distant point until it's time to resume</p>
      <img id="breakGif" class="break-gif" alt="Break Time" />
      <div class="timer" id="timer">20</div>
      <button class="skip-btn" id="skipBtn">Skip Break</button>
    </div>

    <audio id="startSound"></audio>
    <audio id="endSound"></audio>
    <img class="custom-cursor" id="customCursor" />
    
    <script>
      // 🔥 Get asset paths from URL query parameters
      const urlParams = new URLSearchParams(window.location.search);
    
      // Set all asset sources from query parameters
      const startSound = document.getElementById("startSound");
      const endSound = document.getElementById("endSound");
      const breakGif = document.getElementById("breakGif");
      const cursor = document.getElementById("customCursor");
      const skipBtn = document.getElementById("skipBtn");
    
      breakGif.src = urlParams.get("breakGif") || "";
      cursor.src = urlParams.get("cursorMain") || "";
      startSound.src = urlParams.get("breakStart") || "";
      endSound.src = urlParams.get("breakEnd") || "";
    
      // Preload and ensure sounds can play instantly
      startSound.load();
      endSound.load();
    
      // Cursor follow logic
      document.addEventListener("mousemove", (e) => {
        cursor.style.top = e.clientY + "px";
        cursor.style.left = e.clientX + "px";
      });
    
      // Change cursor on hover
      skipBtn.addEventListener("mouseenter", () => {
        cursor.src = urlParams.get("cursorHover") || "";
      });
      skipBtn.addEventListener("mouseleave", () => {
        cursor.src = urlParams.get("cursorMain") || "";
      });
    
      // Play start sound immediately once DOM is ready
      window.addEventListener("DOMContentLoaded", () => {
        const playStart = () => {
          startSound.currentTime = 0;
          startSound.play().catch(() => {
            // If autoplay blocked, wait until user interacts
            document.body.addEventListener("click", () => startSound.play(), { once: true });
          });
        };
        playStart();
      });
    
      // Timer logic (20 seconds countdown)
      const timerElement = document.getElementById("timer");
      let timeLeft = 20;
      const countdown = setInterval(() => {
        timeLeft--;
        timerElement.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(countdown);
          // 🕓 Wait for fade + play exit sound fully before closing
          endSound.currentTime = 0;
          endSound.play();
    
          endSound.addEventListener(
            "ended",
            () => {
              if (window.electronAPI && window.electronAPI.closeOverlay) {
                window.electronAPI.closeOverlay();
              } else {
                window.close();
              }
            },
            { once: true }
          );
        }
      }, 1000);
    
      // Skip button logic
      skipBtn.addEventListener("click", () => {
        if (window.electronAPI && window.electronAPI.closeOverlay) {
          console.log("clicked skip");
          window.electronAPI.closeOverlay();
        } else {
          window.close();
        }
      });
    
      // Display current time
      const timeEl = document.getElementById("currentTime");
      const now = new Date();
      timeEl.textContent =
        "Current time is " +
        now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    </script>
    
  </body>
</html>
